code-archive:
  stage: code-archive
  variables:
    BUILD_TAG: "${CI_COMMIT_REF_NAME}"
  image: python:3.12-slim
  script:
    - apt-get update -y
    - apt-get install -y curl tar git

    # Checkout the correct branch
    - git fetch origin $BUILD_TAG
    - git checkout $BUILD_TAG

    # Combine GitHub token from predefined variables
    - export GITLAB_OAUTH_TOKEN="$ct_archive"

    # Install Python dependencies with pip
    - pip install --no-cache-dir pyyaml jinja2==3.1.6 invoke==2.2.0

    # Define template list (adjust as needed)
    - TEMPLATES=("classification-py" "regression-py" "classification-pyspark" "regression-pyspark")

    # Loop through templates and build archives
    - for TEMPLATE_NAME in "${TEMPLATES[@]}"; do
        echo "Creating archive for $TEMPLATE_NAME";
        cd scripts/code_archive;
        inv dev.create-archive -t $TEMPLATE_NAME --force --ctbranch=$BUILD_TAG;
        cd ../..;
      done

    - cp -r scripts/code_archive/code-archives .

  artifacts:
    name: "artifacts"
    paths:
      - code-archives/
    expire_in: 1 hour
  rules:
    # Only run if docs changed or push/MR to main/dev
    # - changes:
    #     - docs/**

    # Rule 1: Merge request to main or dev
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev")'
      when: always

    # # Rule 2: Push to dev
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "dev")'
      when: always

    # - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH != "master" || $CI_COMMIT_BRANCH != "dev")'
    #   when: always

    - when: never

