  test.complexity:
    desc: Calculate code complexity using Radon
    silent: true
    vars:
      PATH: '{{.path | default "src/ta_lib/"}}'
      HELP_TEXT: |-

        Usage:
          task test.complexity

        Description:
          Calculates cyclomatic complexity for the Python source code using Radon.

        Options:
          path           Target path. Default: 'src/ta_lib/'

        Example:
          task test.complexity

    cmds:
      - cmd: |
          if [ "{{.help}}" = "true" ]; then
            echo "{{.HELP_TEXT}}"
            exit 0
          else
            echo "Running Radon complexity analysis..."
            python -m radon cc "{{.PATH}}" -s -a
          fi
        platforms: [linux, darwin, windows]

  test.unittest:
    desc: Run unit tests
    silent: true
    vars:
      HELP_TEXT: |-

        Usage:
          task test.qc

        Description:
          Runs the unittests for the sub-packages defined in 'PACKAGE_LIST'.

        Example:
          task test.unittest

        Notes:
          - Uses 'for loop' to iterate over the 'PACKAGE_LIST'.

    cmds:
      - cmd: |
          if [ "{{.help}}" = "true" ]; then
            echo "{{.HELP_TEXT}}"
            exit 0
          else
            # main logic
            for pkg in {{range .PACKAGE_LIST}}"{{.}}" {{end}}; do
              echo "Running tests in {{.TEST_BASE_PATH}}/$pkg"
              pytest -v "{{.TEST_BASE_PATH}}/$pkg"
            done
          fi
        platforms: [linux, darwin, windows]

