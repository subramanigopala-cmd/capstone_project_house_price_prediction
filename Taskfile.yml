  # ----------------------------- Building Wheel ----------------------------- #
  build.pkg-dist:
    desc: Builds the package distribution as a wheel files
    silent: true
    vars:
      HELP_TEXT: |-

        Usage:
          task build.pkg-dist

        Description:
          Builds the package distribution as a wheel (.whl) file.

        Example:
          task build.pkg-dist

        Notes:
          - Building wheel needs an activated python environment with 'build' addons installed
    cmds:
      - cmd: |
          if [ "{{.help}}" = "true" ]; then
            echo '{{.HELP_TEXT}}'
            exit 0
          else
            echo "Building wheel..."
            python -m build --wheel
          fi
        platforms: [linux, darwin, windows]

  launch.jupyterlab:
    desc: Launch JupyterLab
    silent: true
    vars:
      IP: '{{.ip | default "localhost"}}'
      PORT: '{{.port | default "8080"}}'
      TOKEN: '{{.token | default ""}}'
      PASSWORD: '{{.password | default ""}}'
      HELP_TEXT: |-

        Usage:
          task launch.jupyterlab [ip=<ip-address>] [port=<port>] [token=<auth-token>] [password=<hashed-password>]

        Description:
          Starts a JupyterLab server using the selected virtual environment.

        Options:
          ip             IP address to bind the server to. Default: localhost
          port           Port to run the JupyterLab server on. Default: 8080
          token          Token used for authentication. Default: ""
          password       Password hash used for authentication. Default: ""

        Example:
          task launch.jupyterlab ip=0.0.0.0 port=8888 token=abc123

        Notes:
          - This task runs JupyterLab with no browser window opened (--no-browser).
          - The password must be a pre-generated hashed string using Jupyter's password utility if provided.
    cmds:
      - cmd: |
          if [ "{{.help}}" = "true" ]; then
            echo "{{.HELP_TEXT}}"
            exit 0
          else
            echo "Launching JupyterLab server on port {{.PORT}}..."
            jupyter lab \
              --ip={{.IP}} \
              --port={{.PORT}} \
              --NotebookApp.token='{{.TOKEN}}' \
              --NotebookApp.password='{{.PASSWORD}}' \
              --no-browser
          fi
        platforms: [linux, darwin, windows]

  dev.run-notebooks:
    desc: Run Jupyter notebooks
    silent: true
    vars:
      TEMPLATE: '{{.template | default "all"}}'
      NOTEBOOKID: '{{.notebookid | default "all"}}'
      TIMEOUT: '{{.timeout | default "600"}}'
      REFRESH: '{{.refresh | default "False"}}'
      NOTEBOOK_FOLDER: './notebooks/tests'
      HELP_TEXT: |-

        Usage:
          task run.notebooks [template=<name>] [notebookid=<id>] [timeout=<seconds>] [refresh=True|False]

        Description:
          Runs notebooks under the specified template to check for execution errors.
          If refresh=True, successful notebooks are refreshed.

        Options:
          template       Folder name under 'notebooks' to run. Options: regression, classification, all. Default: all
          notebookid     Notebook ID to run. Options: 01, 02, 03, all. Default: all
          timeout        Timeout for notebook execution in seconds. Default: 600
          refresh        Boolean indicating whether to refresh notebook outputs on success. Default: False

        Example:
          task dev.run-notebooks template=regression notebookid=01 timeout=900 refresh=True
    cmds:
      - cmd: |
          if [ "{{.help}}" = "true" ]; then
            echo '{{.HELP_TEXT}}'
            exit 0
          else
            echo "Running notebooks:"
            echo "Template: {{.TEMPLATE}}, NotebookID: {{.NOTEBOOKID}}, Timeout: {{.TIMEOUT}}, Refresh: {{.REFRESH}}"
            python "{{.NOTEBOOK_FOLDER}}/utils.py" "{{.TEMPLATE}}" "{{.NOTEBOOKID}}" "{{.TIMEOUT}}" "{{.REFRESH}}"
          fi
        platforms: [linux, darwin, windows]
