# tigerml/pyspark/monitoring/pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tigerml-pyspark-monitoring"
dynamic = ["version"]
description = "TigerML Pyspark Model Monitoring"
license = "LicenseRef-Proprietary"
readme = "README.md"

requires-python = ">=3.10, <3.13"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
	"tigerml.core==0.5.0",
    "tigerml.pyspark.core==0.5.0",
    "tigerml.pyspark.eda==0.5.0",
    "evidently==0.7.10"
]

[project.urls]
Homepage = "https://docs.tigeranalytics.com/tiger-accelerators/dsml-accelerators/TigerML/latest/"
Repository = "https://git.tigeranalytics.com/tiger-accelerators/dsml-accelerators/TigerML"

[tool.setuptools]
package-dir = {"tigerml.pyspark.monitoring" = "."}
packages = [
    "tigerml.pyspark.monitoring",
    "tigerml.pyspark.monitoring.config",
    "tigerml.pyspark.monitoring.core",
    "tigerml.pyspark.monitoring.utils",
]

[tool.setuptools.dynamic.version]
attr = "config.VERSION"
